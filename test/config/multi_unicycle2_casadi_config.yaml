dt: 0.05
d_safe: 0.5
inter_robot_visibility_radius: 1.0
horizon: 40
mode: mpc
Q_diag: [100.0, 100.0, 10.0, 100.0, 1.0, 100.0, 100.0, 10.0, 100.0, 1.0]
R_weight: 0.1
terminal_cost_multiplier: 10000.0
collision_slack_penalty_weight: 10000.0
error_tolerance: 0.05
initial_state_seed: 42
action_noise_seed: 42

robots:
  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 1.0
      goal: [0.0, -0.5, 0.0]
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]
      error_tolerance: 0.05

  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 1.0
      goal: [0.0, 0.5, 0.0]
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]
      error_tolerance: 0.05