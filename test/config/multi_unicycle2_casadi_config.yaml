dt: 0.05
d_safe: 1.2
d_collision: 1.0
inter_robot_visibility_radius: 2.0
horizon: 40
mode: mpc
Q_diag: [100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0]
R_weight: 0.1
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 1000000.0
initial_state_seed: 0
action_noise_seed: 10

robots:
  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 2.0
      max_omega: 2.0
      max_speed: 2.0
      goal: [1.0, 0.0, 1.57]    # change during eval, to test generalization
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 3.0]
      pos_tol: 0.2
      theta_tol: 1.1
      vel_tol: 0.05
      omega_tol: 0.05

  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 2.0
      max_omega: 2.0
      max_speed: 2.0
      goal: [-1.0, 0.0, 1.57]   # change during eval, to test generalization
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 3.0]
      pos_tol: 0.2
      theta_tol: 1.1
      vel_tol: 0.05
      omega_tol: 0.05