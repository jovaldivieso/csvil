# 2x unicycle2 expert config for the crash ladder: 0.1 m robot at 1.5 m/s / 6.0 rad/s, dt 0.005.
dt: 0.005
d_safe: 0.12
d_collision: 0.1
inter_robot_visibility_radius: 0.4
horizon: 40
mode: mpc
R_diag: [0.0140625, 0.001, 0.0140625, 0.001]
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 100000000.0
terminal_velocity_weight: 0.444444
fallback_terminal_velocity_tol: 0.015
initial_state_seed: 0
action_noise_seed: 10
Q_diag: [10000.0, 10000.0, 10.0, 44.444444, 0.111111,
         10000.0, 10000.0, 10.0, 44.444444, 0.111111]
robots:
- system: unicycle2
  config:
    dt: 0.005
    max_linear_accel: 8.0
    max_angular_accel: 150.0
    max_linear_vel: 1.5
    max_angular_vel: 6.0
    randomize_goal: true
    pos_tol: 0.01
    theta_tol: 1.1
    vel_tol: 0.075
    omega_tol: 0.15
    workspace_bounds: [-0.3, 0.3]
- system: unicycle2
  config:
    dt: 0.005
    max_linear_accel: 8.0
    max_angular_accel: 150.0
    max_linear_vel: 1.5
    max_angular_vel: 6.0
    randomize_goal: true
    pos_tol: 0.01
    theta_tol: 1.1
    vel_tol: 0.075
    omega_tol: 0.15
    workspace_bounds: [-0.3, 0.3]
