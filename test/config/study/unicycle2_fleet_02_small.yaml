# 2x unicycle2 fleet, 0.1 m robot at 1.5 m/s / 6.0 rad/s.
# Generated by test/config/generate_small_robot_configs.py -- do not edit by hand.
#
# unicycle2_fleet_02.yaml at a 0.1x length scale. Lengths scale;
# the speeds were specified and do not, so dt falls to 0.005 to keep the per-step
# travel (0.0075 m) well inside d_collision, and every cost weight
# is restated so its term keeps the magnitude the 1 m configs produced.
# max_linear_accel / max_angular_accel are *assumed* wheeled-robot friction limits,
# not measured -- they set how ballistic the task is (stopping distance 0.141 m =
# 1.41 d_collision, against 0.17 on the 1 m robot). Rerun with --accel to change them.
#
# Box +-0.3 here; the policy configs override it to +-0.1732
# (3x density), as the data_mid pilots did.
dt: 0.005
d_safe: 0.12
d_collision: 0.1
inter_robot_visibility_radius: 0.4
horizon: 40
mode: mpc
R_diag: [0.0140625, 0.001, 0.0140625, 0.001]
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 100000000.0
terminal_velocity_weight: 0.444444
fallback_terminal_velocity_tol: 0.015
initial_state_seed: 0
action_noise_seed: 10
Q_diag: [10000.0, 10000.0, 10.0, 44.444444, 0.111111,
         10000.0, 10000.0, 10.0, 44.444444, 0.111111]
robots:
- system: unicycle2
  config:
    dt: 0.005
    max_linear_accel: 8.0
    max_angular_accel: 150.0
    max_linear_vel: 1.5
    max_angular_vel: 6.0
    randomize_goal: true
    pos_tol: 0.01
    theta_tol: 1.1
    vel_tol: 0.075
    omega_tol: 0.15
    workspace_bounds: [-0.3, 0.3]
- system: unicycle2
  config:
    dt: 0.005
    max_linear_accel: 8.0
    max_angular_accel: 150.0
    max_linear_vel: 1.5
    max_angular_vel: 6.0
    randomize_goal: true
    pos_tol: 0.01
    theta_tol: 1.1
    vel_tol: 0.075
    omega_tol: 0.15
    workspace_bounds: [-0.3, 0.3]
