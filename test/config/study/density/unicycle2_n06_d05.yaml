# 6x unicycle2 density axis of the encoder study, 0.5x the training density.
# Generated by test/config/generate_eval_configs.py -- do not edit by hand.
# The fleet size is fixed along this axis, so the ceiling on visible
# neighbours is fixed too and what changes is how close they come.
# workspace_bounds +-4.242: 0.0834 robots/m^2, 0.50x the training density;
# d_safe disks of starts and goals block 19% of the area; mean visible neighbours ~1.98.
dt: 0.05
d_safe: 1.2
d_collision: 1.0
inter_robot_visibility_radius: 4.0
horizon: 40
mode: mpc
R_weight: 0.1
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 1000000.0
initial_state_seed: 0
action_noise_seed: 10
Q_diag: [100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0]
