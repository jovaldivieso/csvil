- system: unicycle2
  config:
    dt: 0.05
    max_linear_accel: 3.0
    max_angular_accel: 15.0
    max_linear_vel: 1.0
    max_angular_vel: 2.0
    randomize_goal: true
    pos_tol: 0.1
    theta_tol: 1.1
