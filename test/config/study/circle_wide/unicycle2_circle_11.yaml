# 11x unicycle2 antipodal-circle swap for the encoder-scaling study.
# Generated by test/config/generate_circle_configs.py -- do not edit by hand.
# Robot i starts at angle 2*pi*i/11 on a circle of radius 4.2594,
# sized for a 2.400 m floor (2.0x d_safe) on the distance
# between neighbours, which 0.1667 robots/m^2 would fall below at this N,
# and targets the antipode, which is the gap between two starts (N is odd).
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 2.400 (d_safe=1.2); 2.00 visible neighbours at t=0;
# needs >= 171 steps even in a straight line.
dt: 0.05
d_safe: 1.2
d_collision: 1.0
inter_robot_visibility_radius: 4.0
horizon: 40
mode: mpc
R_weight: 0.1
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 1000000.0
initial_state_seed: 0
action_noise_seed: 10
Q_diag: [100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
