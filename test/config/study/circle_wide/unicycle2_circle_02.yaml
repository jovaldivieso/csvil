# 2x unicycle2 antipodal-circle swap for the encoder-scaling study.
# Generated by test/config/generate_circle_configs.py -- do not edit by hand.
# Robot i starts at angle 2*pi*i/2 on a circle of radius 1.7319,
# sized for 0.1667 robots/m^2 so every fleet size rings at the same density.
# and targets the antipode, which is the start of robot i+1.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 3.464 (d_safe=1.2); 1.00 visible neighbours at t=0;
# needs >= 70 steps even in a straight line.
dt: 0.05
d_safe: 1.2
d_collision: 1.0
inter_robot_visibility_radius: 4.0
horizon: 40
mode: mpc
R_weight: 0.1
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 1000000.0
initial_state_seed: 0
action_noise_seed: 10
Q_diag: [100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0]
robots:
- system: unicycle2
  config:
    dt: 0.05
    max_linear_accel: 3.0
    max_angular_accel: 15.0
    max_linear_vel: 1.0
    max_angular_vel: 2.0
    randomize_goal: false
    pos_tol: 0.1
    theta_tol: 1.1
    vel_tol: 0.05
    omega_tol: 0.05
    workspace_bounds: [-3.0, 3.0]
    goal: [-1.7319, -0.0, -3.141593]
    start: [1.7319, 0.0, -3.141593, 0.0, 0.0]
- system: unicycle2
  config:
    dt: 0.05
    max_linear_accel: 3.0
    max_angular_accel: 15.0
    max_linear_vel: 1.0
    max_angular_vel: 2.0
    randomize_goal: false
    pos_tol: 0.1
    theta_tol: 1.1
    vel_tol: 0.05
    omega_tol: 0.05
    workspace_bounds: [-3.0, 3.0]
    goal: [1.7319, -0.0, -0.0]
    start: [-1.7319, 0.0, -0.0, 0.0, 0.0]
