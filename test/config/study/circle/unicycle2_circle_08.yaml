- system: unicycle2
  config:
    dt: 0.05
    max_accel: 2.0
    max_omega: 2.0
    max_speed: 2.0
    randomize_goal: false
    initial_position_min_goal_distance: 0.05
    initial_position_radius_bounds: [0.05, 3.0]
    pos_tol: 0.1
    theta_tol: 1.1
    vel_tol: 0.05
