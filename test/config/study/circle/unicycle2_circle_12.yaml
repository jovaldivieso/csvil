# 12x unicycle2 antipodal-circle swap for the encoder-scaling study.
# Generated by test/config/generate_circle_configs.py -- do not edit by hand.
# Robot i starts at angle 2*pi*i/12 on a circle of radius 4.2422,
# sized for 0.1667 robots/m^2 so every fleet size rings at the same density.
# and targets the antipode, which is the start of robot i+6.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 2.196 (d_safe=1.2); 2.00 visible neighbours at t=0;
# needs >= 170 steps even in a straight line.
