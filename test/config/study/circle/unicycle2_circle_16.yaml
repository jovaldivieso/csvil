# 16x unicycle2 antipodal-circle swap for the encoder-scaling study.
# Generated by test/config/generate_circle_configs.py -- do not edit by hand.
# Robot i starts at angle 2*pi*i/16 on a circle of radius 4.6132
# and targets the antipode, which is the start of robot i+8.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 1.800 (d_safe=1.2); 4.00 visible neighbours at t=0;
# needs >= 93 steps even in a straight line.
