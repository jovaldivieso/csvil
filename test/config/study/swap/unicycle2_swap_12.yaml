# 12x unicycle2 corner swap for the encoder-scaling study.
# Generated by test/config/generate_swap_configs.py -- do not edit by hand.
# Robots 0..5 stack downwards from the top-right corner (+7.348, +7.348) at
# 1.2 apart (1.0x d_safe); robots 6..11 stack the same way from the
# bottom-left corner. Robot i's goal is its own antipode -start, i.e. the start of
# robot i+6 (mod 12); all 12 paths cross the origin.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 1.200 (d_safe=1.2); 4.00 visible neighbours at t=0;
# the corner robots cross 20.783 m, so the run needs >= 416 steps
# even in a straight line.
