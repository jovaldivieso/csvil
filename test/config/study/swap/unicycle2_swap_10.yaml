# 10x unicycle2 corner swap for the encoder-scaling study.
# Generated by test/config/generate_swap_configs.py -- do not edit by hand.
# Robots 0..4 stack downwards from the top-right corner (+6.708, +6.708) at
# 1.2 apart (1.0x d_safe); robots 5..9 stack the same way from the
# bottom-left corner. Robot i's goal is its own antipode -start, i.e. the start of
# robot i+5 (mod 10); all 10 paths cross the origin.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 1.200 (d_safe=1.2); 3.60 visible neighbours at t=0;
# the corner robots cross 18.973 m, so the run needs >= 380 steps
# even in a straight line.
