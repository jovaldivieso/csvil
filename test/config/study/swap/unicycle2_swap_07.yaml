# 7x unicycle2 corner swap for the encoder-scaling study.
# Generated by test/config/generate_swap_configs.py -- do not edit by hand.
# Robots 0..2 stack downwards from the top-right corner (+5.612, +5.612) at
# 1.2 apart (1.0x d_safe); robots 3..6 stack the same way from the
# bottom-left corner. Robot i's goal is its own antipode -start, which at this odd N is
# a point no robot is vacating; all 7 paths cross the origin.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 1.200 (d_safe=1.2); 2.57 visible neighbours at t=0;
# the corner robots cross 15.873 m, so the run needs >= 318 steps
# even in a straight line.
