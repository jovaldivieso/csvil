# 8x unicycle2 corner swap for the encoder-scaling study.
# Generated by test/config/generate_swap_configs.py -- do not edit by hand.
# Robots 0..3 stack downwards from the top-right corner (+6.0, +6.0) at
# 1.2 apart (1.0x d_safe); robots 4..7 stack the same way from the
# bottom-left corner. Robot i's goal is its own antipode -start, i.e. the start of
# robot i+4 (mod 8); all 8 paths cross the origin.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 1.200 (d_safe=1.2); 3.00 visible neighbours at t=0;
# the corner robots cross 16.971 m, so the run needs >= 340 steps
# even in a straight line.
dt: 0.05
d_safe: 1.2
d_collision: 1.0
inter_robot_visibility_radius: 4.0
horizon: 40
mode: mpc
R_weight: 0.1
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 1000000.0
initial_state_seed: 0
action_noise_seed: 10
Q_diag: [100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
