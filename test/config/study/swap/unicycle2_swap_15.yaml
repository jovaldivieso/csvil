# 15x unicycle2 corner swap for the encoder-scaling study.
# Generated by test/config/generate_swap_configs.py -- do not edit by hand.
# Robots 0..6 stack downwards from the top-right corner (+8.216, +8.216) at
# 1.2 apart (1.0x d_safe); robots 7..14 stack the same way from the
# bottom-left corner. Robot i's goal is its own antipode -start, which at this odd N is
# a point no robot is vacating; all 15 paths cross the origin.
# Deterministic: fixed 'start' and 'goal', randomize_goal false.
# Closest starting pair 1.200 (d_safe=1.2); 4.40 visible neighbours at t=0;
# the corner robots cross 23.238 m, so the run needs >= 465 steps
# even in a straight line.
