# 8x unicycle2 fleet for the encoder-scaling study.
# Generated by test/config/generate_fleet_configs.py -- do not edit by hand.
# Per-robot task is identical across fleet sizes; only 'robots', 'Q_diag' and
# 'goal_position_bounds' (+-6.0) vary with the fleet size.
# Sized for d_safe=1.2; mean visible neighbours ~1.14.
