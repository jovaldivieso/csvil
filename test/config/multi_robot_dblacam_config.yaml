dt: 0.1
d_safe: 1.2
d_collision: 1.0
inter_robot_visibility_radius: 4.0

environment:
  min: [0.0, 0.0]
  max: [8.0, 8.0]
  obstacles: []

db_lacam:
  mode: open_loop
  replan_on_deviation: true
  deviation_threshold: 0.15
  time_limit_ms: 60000
  algorithm_config: planning/dblacam_algorithm_default.yaml

  motion_primitives:
    unicycle1_v0: /workspace/data/motion_primitives/unicycle1_v0.bin.im.bin.sp.bin

robots:
  num_robots: 2
  system: single_integrator
  config:
    dt: 0.1
    max_vel: 0.5
    workspace_bounds: [0.0, 8.0]