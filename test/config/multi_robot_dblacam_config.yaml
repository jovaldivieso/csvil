db_lacam:
  mode: replan
  replan_freq: 60
  time_limit_ms: 60000

  environment:
    min: [0.0, 0.0]
    max: [8.0, 8.0]
    obstacles: []

robots:
  - system: single_integrator

    start:
      - 2.0
      - 2.0

    goal:
      - 5.0
      - 5.0

    config:
      dt: 0.1
      max_vel: 0.5
      error_tolerance: 0.1

  - system: single_integrator

    start:
      - 5.0
      - 5.0

    goal:
      - 1.5
      - 1.5

    config:
      dt: 0.1
      max_vel: 0.5
      error_tolerance: 0.1

  - system: unicycle1

    start:
      - 3.0       
      - 2.0       
      - 3.1415    

    goal:
      - 2.0
      - 5.0
      - 3.1415

    config:
      dt: 0.1
      max_v: 0.5
      error_tolerance: 0.1