dt: 0.1
d_safe: 0.2
d_collision: 0.2
inter_robot_visibility_radius: 4.0

environment:
  min: [0.0, 0.0]
  max: [8.0, 8.0]
  obstacles: []

db_lacam:
  mode: open_loop
  replan_on_deviation: true
  deviation_threshold: 0.15
  time_limit_ms: 10000
  algorithm_config: planning/dblacam_algorithm_default.yaml

  motion_primitives:
    integrator2_2d_v0: /workspace/data/motion_primitives/integrator2_2d_v0.bin.im.bin.sp.bin

robots:
  num_robots: 3
  system: double_integrator
  config:
    dt: 0.1
    max_accel: 2.0