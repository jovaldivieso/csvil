db_lacam:
  mode: replan
  replan_freq: 20
  time_limit_ms: 60000

  environment:
    min: [0.0, 0.0]
    max: [5.0, 5.0]
    obstacles: []

robots:
  - system: single_integrator

    start:
      - 1.0
      - 2.5

    goal:
      - 4.0
      - 2.5

    config:
      dt: 0.1
      max_vel: 0.5
      error_tolerance: 0.05

  - system: unicycle1

    start:
      - 4.0
      - 2.5
      - 3.1415

    goal:
      - 1.0
      - 2.5
      - 3.1415

    config:
      dt: 0.1
      max_v: 0.5
      error_tolerance: 0.05