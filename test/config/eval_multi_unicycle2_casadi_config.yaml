dt: 0.05
d_safe: 0.5
inter_robot_visibility_radius: 1.0
horizon: 20
mode: mpc
Q_diag: [100.0, 100.0, 10.0, 100.0, 1.0, 
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0,
         100.0, 100.0, 10.0, 100.0, 1.0]
R_weight: 0.1
terminal_cost_multiplier: 1000.0
collision_slack_penalty_weight: 100000.0
initial_state_seed: 0
action_noise_seed: 10

robots:
  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 2.0
      max_omega: 2.0
      max_speed: 2.0
      goal: [0.0, -0.5, 1.57] # change during eval, to test generalization
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]
      pos_tol: 0.05
      theta_tol: 1.0
      vel_tol: 0.05
      omega_tol: 0.05

  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 2.0
      max_omega: 2.0
      max_speed: 2.0
      goal: [0.0, 0.5, -1.57]   # change during eval, to test generalization
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]
      pos_tol: 0.05
      theta_tol: 1.0
      vel_tol: 0.05
      omega_tol: 0.05

  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 2.0
      max_omega: 2.0
      max_speed: 2.0
      goal: [0.5, 0.0, 3.14]   # change during eval, to test generalization
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]
      pos_tol: 0.05
      theta_tol: 1.0
      vel_tol: 0.05
      omega_tol: 0.05

  - system: unicycle2
    config:
      dt: 0.05
      max_accel: 2.0
      max_omega: 2.0
      max_speed: 2.0
      goal: [-0.5, 0.0, 0.0]   # change during eval, to test generalization
      randomize_goal: false
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]
      pos_tol: 0.05
      theta_tol: 1.0
      vel_tol: 0.05
      omega_tol: 0.05
