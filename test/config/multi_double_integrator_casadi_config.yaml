dt: 0.05
d_safe: 0.5
inter_robot_visibility_radius: 1.0
horizon: 20
mode: mpc
Q_diag: [10.0, 10.0, 1.0, 1.0, 10.0, 10.0, 1.0, 1.0]
R_weight: 0.1
terminal_cost_multiplier: 10.0
error_tolerance: 0.05
initial_state_seed: 0

robots:
  - system: double_integrator
    config:
      dt: 0.05
      max_accel: 2.0
      goal: [0.0, -0.5]
      randomize_goal: false
      error_tolerance: 0.05
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]

  - system: double_integrator
    config:
      dt: 0.05
      max_accel: 2.0
      goal: [0.0, 0.5]
      randomize_goal: false
      error_tolerance: 0.05
      initial_position_min_goal_distance: 0.05
      initial_position_radius_bounds: [0.05, 1.0]
