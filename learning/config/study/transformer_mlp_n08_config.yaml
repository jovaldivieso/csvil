# transformer policy for the 8-robot cell of the encoder-scaling study.
# Generated by learning/config/study/generate_study_policy_configs.py from
# transformer_mlp_config.yaml -- do not edit by hand; edit the template or the script.
#
# 17 of the 50 episodes per DAgger round (33%) start from the ring layouts
# below; the rest fall back to the expert config's randomized goals.
# Radii 3.0 (rollout 0, the circle-eval layout) then 2.0-4.0; closest
# starting pair 1.509 (d_safe=1.2).
# Layouts: ellipse x2, heading x3, heading_neg x2, heading_tangent x2, jitter x3,
# nominal x3, skew x2.
# Encoder-scaling study: transformer baseline.
# Identical to the deepset/gnn study configs except for the neighbour encoder.
# Context width is 128 in all three.
model:
  policy_type: mlp
  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 1        # single-step: a deterministic MSE-trained MLP regresses to the
                               # conditional mean, so multi-step chunks average over distinct
                               # avoidance manoeuvres. Use the flow policy for horizon > 1.
  hidden_dims: [256, 256, 256]

  encoder: transformer

  transformer:
    hidden_dim: 128        # -> context width 128
    num_heads: 4
    num_layers: 1
    dropout: 0.1

training:
  # unicycle
  tolerance_overrides:
    pos_tol: 0.1
    theta_tol: 0.78
    vel_tol: 0.1
    omega_tol: 0.1

  # Antipodal-ring rollouts, the training-time counterpart of the 'circle'
  # evaluation scenario. Per-robot, so this file only fits 8 robots.
