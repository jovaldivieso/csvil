# deepset flow policy for the 4-robot cell of the study.
# Generated by learning/config/study/generate_study_policy_configs.py from
# deepset_flow_config.yaml -- do not edit by hand; edit the template or the script.
#
# 67 of the 200 episodes per DAgger round (33%) start from the ring layouts
# below; the rest fall back to the expert config's randomized goals.
# 350 steps per episode, scaled from 250 at +-3.0 to this fleet's +-4.243 workspace.
# Radii 3.0 (rollout 0, the circle-eval layout) then 2.0-4.0; closest
# starting pair 1.504 (d_safe=1.2).
# Layouts: ellipse x9, heading x10, heading_neg x10, heading_tangent x9, jitter x10,
# nominal x10, skew x9.
# Encoder-scaling study: DeepSet flow baseline.
# Identical to the transformer/gnn flow study configs except for the neighbour encoder,
# and to deepset_mlp_config.yaml except for the policy head.
# Context width is 128 in all three.
model:
  policy_type: flow

  flow:
    num_inference_steps: 3      # Euler integration steps for ODE sampling

  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 10        # action chunk; the generative head's intended setting
  hidden_dims: [256, 256, 256]

  encoder: deepset

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]        # -> context width 128
    pool_type: mean        # Can be sum, max, mean (GNN uses sum!)

training:
  # DAgger schedule. train.sh passes only the run identity, so these values are
  # the single source; a flag given to train_dagger.py by hand overrides them.
  dagger_iterations: 5
  trajectories_per_iteration: [200, 200, 200, 200, 200]
  steps_per_trajectory: 350
  target_epochs_per_round: [40, 40, 40, 40, 40]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  eval_episodes: 20
  # No tolerance_overrides: convergence tolerances belong to the scenario
  # config, so training and evaluation share one definition of success.
  # Antipodal-ring rollouts, the training-time counterpart of the 'circle'
  # evaluation scenario. Per-robot, so this file only fits 4 robots.
