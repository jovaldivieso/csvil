# Encoder-scaling study: transformer baseline.
# [template-only] run_study.sh does not train from this file: it trains from the
# [template-only] per-fleet-size configs that generate_study_policy_configs.py derives
# [template-only] from it, which is also where the 'training' section (tolerances and
# [template-only] the ring initial_states/goal_states) is added.
# Identical to the deepset/gnn study configs except for the neighbour encoder.
# Context width is 128 in all three.
model:
  policy_type: mlp
  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 1        # single-step: a deterministic MSE-trained MLP regresses to the
                               # conditional mean, so multi-step chunks average over distinct
                               # avoidance manoeuvres. Use the flow policy for horizon > 1.
  hidden_dims: [256, 256, 256]

  encoder: transformer

  transformer:
    hidden_dim: 128        # -> context width 128
    num_heads: 4
    num_layers: 1
    dropout: 0.1
