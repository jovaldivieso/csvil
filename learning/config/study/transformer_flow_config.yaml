# [template-only] Transformer flow model; generate_study_policy_configs.py builds the per-fleet configs from it.
model:
  policy_type: flow

  flow:
    num_inference_steps: 3      # Euler integration steps for ODE sampling

  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 1
  hidden_dims: [256, 256, 256]

  encoder: transformer

  transformer:
    hidden_dim: 128
    num_heads: 4
    num_layers: 1
    dropout: 0.1
