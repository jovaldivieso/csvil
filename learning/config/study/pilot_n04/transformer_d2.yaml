# N=4 transformer flow pilot 'd2': twice the training density.
# Generated by learning/config/study/generate_pilot_configs.py -- do not edit by hand.
#
# Trained against test/config/study/unicycle2_fleet_04.yaml, but with starts and
# goals drawn from +-3.0 instead of the config's +-4.243:
# 0.1111 robots/m^2, 2x the study's training density.
# Pilot schedule: 5 rounds x 300 episodes x 300 steps, 40 epochs.
# Encoder-scaling study: transformer flow baseline.
# Identical to the deepset/gnn flow study configs except for the neighbour encoder,
# and to transformer_mlp_config.yaml except for the policy head.
# Context width is 128 in all three.
model:
  policy_type: flow

  flow:
    num_inference_steps: 3      # Euler integration steps for ODE sampling

  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 10        # action chunk; the generative head's intended setting
  hidden_dims: [256, 256, 256]

  encoder: transformer

  transformer:
    hidden_dim: 128        # -> context width 128
    num_heads: 4
    num_layers: 1
    dropout: 0.1

training:
  # DAgger schedule. train.sh passes only the run identity, so these values are
  # the single source; a flag given to train_dagger.py by hand overrides them.
  dagger_iterations: 5
  trajectories_per_iteration: [300, 300, 300, 300, 300]
  steps_per_trajectory: 300
  target_epochs_per_round: [40, 40, 40, 40, 40]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  eval_episodes: 20
  workspace_bounds: [-3.0, 3.0]
  # 100 of the 300 episodes per round start from ring
  # layouts of radius 2.0-3.0; closest starting pair
  # 1.732 (d_safe=1.2).
