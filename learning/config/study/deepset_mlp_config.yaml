# Encoder-scaling study: DeepSet baseline.
# Shared across all fleet sizes; identical to the transformer/gnn study configs
# except for the neighbour encoder. Context width is 128 in all three.
model:
  policy_type: mlp
  prediction_horizon: 1        # single-step: a deterministic MSE-trained MLP regresses to the
                               # conditional mean, so multi-step chunks average over distinct
                               # avoidance manoeuvres. Use the flow policy for horizon > 1.
  hidden_dims: [256, 256, 256]

  encoder: deepset

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]        # -> context width 128
    pool_type: mean        # Can be sum, max, mean (GNN uses sum!)