# Study 1 retrain: deepset mlp_h10 policy, 4 robots.
# Generated by learning/config/study/generate_study_policy_configs.py from
# deepset_mlp_config.yaml -- do not edit by hand; edit the template or the script.
#
# 67 of the 200 episodes per DAgger round (33%) start from the ring layouts below;
# the rest fall back to the expert config's randomized goals. Closest starting
# pair 1.732 (d_safe=1.2).
# Encoder-scaling study: DeepSet baseline.
# Identical to the transformer/gnn study configs except for the neighbour encoder.
# Context width is 128 in all three.
model:
  policy_type: mlp
  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 10        # MSE regression over an action chunk
  hidden_dims: [256, 256, 256]

  encoder: deepset

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]        # -> context width 128
    pool_type: sum        # options: sum, max, mean

training:
  # Study 1 DAgger schedule. train_dagger.py reads this section as defaults, so
  # launch with only --experiment-name/--system/--expert-config/--policy-config/
  # --seed; any other flag on the command line overrides the value here.
  dagger_iterations: 5
  trajectories_per_iteration: [200, 200, 200, 200, 200]
  steps_per_trajectory: 250
  target_epochs_per_round: [40, 40, 40, 40, 40]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  expert_mix_beta_recovery: 0.75
  expert_mix_beta_recovery_increment: 0.25
  eval_episodes: 200
  workspace_bounds: [-3.0, 3.0]
  tolerance_overrides: {pos_tol: 0.1, theta_tol: 0.78, vel_tol: 0.1, omega_tol: 0.1}
  eval_tolerance_overrides: {pos_tol: 0.2, theta_tol: 1.1, vel_tol: 0.5, omega_tol: 0.5}
  training_curriculum: [config, config, config, config, config]
  # workspace_bounds and the tolerance overrides apply to training and its
  # in-loop eval only: test/evaluate_scaling.py scores against the scenario
  # config, so post-training numbers use that arena and those tolerances.
