# N=2 deepset mlp on the 0.1 m robot: 5 rounds x 288 episodes.
# Generated by test/config/generate_small_robot_configs.py -- do not edit by hand.
#
# Trained against test/config/study/unicycle2_fleet_02_small.yaml, but with starts and
# goals drawn from +-0.1732 instead of that config's +-0.3:
# 16.67 robots/m^2, 3x the study's training density, as the data_mid pilots used.
# 5 rounds x 288 episodes x 40 epochs x 250 steps;
# 144000 frames per round (one dataset episode per robot).
# The schedule is the data_mid_flow one, identical across all three heads.
# Encoder-scaling study: DeepSet baseline.
# Identical to the transformer/gnn study configs except for the neighbour encoder.
# Context width is 128 in all three.
model:
  policy_type: mlp
  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 1        # single-step regression
  hidden_dims: [256, 256, 256]

  encoder: deepset

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]        # -> context width 128
    pool_type: mean        # Can be sum, max, mean (GNN uses sum!)

training:
  # DAgger schedule. train.sh passes only the run identity, so these values are
  # the single source; a flag given to train_dagger.py by hand overrides them.
  dagger_iterations: 5
  trajectories_per_iteration: [288, 288, 288, 288, 288]
  steps_per_trajectory: 250
  target_epochs_per_round: [40, 40, 40, 40, 40]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  expert_mix_beta_recovery: 0.75
  expert_mix_beta_recovery_increment: 0.25
  eval_episodes: 288
  workspace_bounds: [-0.1732, 0.1732]
  # No tolerance_overrides: convergence tolerances belong to the scenario
  # config, so training and evaluation share one definition of success.
  # 144 of the 288 episodes per round (50%) start from antipodal
  # ring layouts of radius 0.2-0.1732; closest starting pair
  # 0.2748 (d_safe=0.12). Per-robot, so this file only fits 2 robots.
  # Layouts: heading x29, heading_neg x29, heading_tangent x28, jitter x29, nominal
