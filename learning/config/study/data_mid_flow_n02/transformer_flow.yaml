# N=2 transformer flow data pilot 'data_mid_flow': 5 rounds x 480 episodes.
# Generated by learning/config/study/generate_data_pilot_configs.py -- do not edit by hand.
#
# Trained against test/config/study/unicycle2_fleet_02.yaml, but with
# starts and goals drawn from +-1.732 instead of the config's +-3.0:
# 0.1667 robots/m^2, 3x the study's training density.
# 150 steps per episode, scaled from 250 at +-3.0 to this box.
# 5 rounds x 480 episodes x 40 epochs; 144000 frames per round
# (480 episodes x 150 steps x 2 robots, one dataset episode per robot). Estimate 14.7 h per run.
# Encoder-scaling study: transformer flow baseline.
# Identical to the deepset/gnn flow study configs except for the neighbour encoder,
# and to transformer_mlp_config.yaml except for the policy head.
# Context width is 128 in all three.
model:
  policy_type: flow

  flow:
    num_inference_steps: 3      # Euler integration steps for ODE sampling

  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 10        # action chunk; the generative head's intended setting
  hidden_dims: [256, 256, 256]

  encoder: transformer

  transformer:
    hidden_dim: 128        # -> context width 128
    num_heads: 4
    num_layers: 1
    dropout: 0.1

training:
  # DAgger schedule. train.sh passes only the run identity, so these values are
  # the single source; a flag given to train_dagger.py by hand overrides them.
  dagger_iterations: 5
  trajectories_per_iteration: [480, 480, 480, 480, 480]
  steps_per_trajectory: 150
  target_epochs_per_round: [40, 40, 40, 40, 40]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  expert_mix_beta_recovery: 0.75
  expert_mix_beta_recovery_increment: 0.25
  eval_episodes: 480
  workspace_bounds: [-1.732, 1.732]
