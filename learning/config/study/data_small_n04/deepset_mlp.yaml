# N=4 deepset mlp data pilot 'data_small': 3 rounds x 50 episodes.
# Generated by learning/config/study/generate_data_pilot_configs.py -- do not edit by hand.
#
# Trained against test/config/study/unicycle2_fleet_04.yaml, but with
# starts and goals drawn from +-2.45 instead of the config's +-4.243:
# 0.1666 robots/m^2, 3x the study's training density.
# 200 steps per episode, scaled from 250 at +-3.0 to this box.
# Episodes per round sized for ~3 h per run (estimate 2.9 h); gradient steps are
# capped at 40000 per round, so only the amount of data varies.
# Encoder-scaling study: DeepSet baseline.
# Identical to the transformer/gnn study configs except for the neighbour encoder.
# Context width is 128 in all three.
model:
  policy_type: mlp
  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 1        # single-step regression
  hidden_dims: [256, 256, 256]

  encoder: deepset

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]        # -> context width 128
    pool_type: mean        # Can be sum, max, mean (GNN uses sum!)

training:
  # DAgger schedule. train.sh passes only the run identity, so these values are
  # the single source; a flag given to train_dagger.py by hand overrides them.
  dagger_iterations: 3
  trajectories_per_iteration: [50, 50, 50]
  steps_per_trajectory: 200
  target_epochs_per_round: [400, 400, 400]
  max_train_steps: 40000
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  eval_episodes: 20
  workspace_bounds: [-2.45, 2.45]
  # 17 of the 50 episodes per round start from ring
  # layouts of radius 2.0-2.45; closest starting pair
  # 1.855 (d_safe=1.2).
  # Layouts: ellipse x2, heading x3, heading_neg x2, heading_tangent x2, jitter x3,
  # nominal x3, skew x2.
