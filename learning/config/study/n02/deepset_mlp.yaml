# deepset mlp policy for the 2-robot cell of the study.
# Generated by learning/config/study/generate_study_policy_configs.py from
# deepset_mlp_config.yaml -- do not edit by hand; edit the template or the script.
#
# 33 of the 100 episodes per DAgger round (33%) start from the ring layouts
# below; the rest fall back to the expert config's randomized goals.
# Radii 3.0 (rollout 0, the circle-eval layout) then 2.0-3.0; closest
# starting pair 3.714 (d_safe=1.2).
# Layouts: heading x7, heading_neg x6, heading_tangent x6, jitter x7, nominal x7.
# Encoder-scaling study: DeepSet baseline.
# Identical to the transformer/gnn study configs except for the neighbour encoder.
# Context width is 128 in all three.
model:
  policy_type: mlp
  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 1        # single-step regression
  hidden_dims: [256, 256, 256]

  encoder: deepset

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]        # -> context width 128
    pool_type: mean        # Can be sum, max, mean (GNN uses sum!)

training:
  # DAgger schedule. train.sh passes only the run identity, so these values are
  # the single source; a flag given to train_dagger.py by hand overrides them.
  dagger_iterations: 3
  trajectories_per_iteration: [100, 100, 100]
  steps_per_trajectory: 200
  target_epochs_per_round: [400, 400, 400]
  max_train_steps: 40000
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  eval_episodes: 20
  # No tolerance_overrides: convergence tolerances belong to the scenario
  # config, so training and evaluation share one definition of success.
  # Antipodal-ring rollouts, the training-time counterpart of the 'circle'
  # evaluation scenario. Per-robot, so this file only fits 2 robots.
