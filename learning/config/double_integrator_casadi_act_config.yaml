# Dataset settings
dataset:
  repo_id: local/double_integrator_casadi_expert
  root: data/lerobot_dataset_double_integrator_casadi

# Policy settings
policy:
  type: act
  device: mps
  
  repo_id: jovaldivieso/double_integrator_casadi_act
  push_to_hub: true

  # Neural network settings
  dim_model: 64
  dim_feedforward: 466
  n_heads: 1
  n_encoder_layers: 1
  n_decoder_layers: 1
  n_vae_encoder_layers: 1
  
  # Action chunking & History adjustments
  chunk_size: 16
  n_action_steps: 1
  n_obs_steps: 1            # Must be 1 for LeRobot's ACT implementation
  
  normalization_mapping:
    STATE: MIN_MAX
    ENV: MIN_MAX
    ACTION: MIN_MAX
  
  input_features:
    observation.environment_state:
      shape: [2]
      type: ENV
    observation.state:
      shape: [2]
      type: STATE
      
  output_features:
    action:
      shape: [2]
      type: ACTION

# Training settings
steps: 5000
save_freq: 5000
batch_size: 64
num_workers: 0
save_checkpoint: true