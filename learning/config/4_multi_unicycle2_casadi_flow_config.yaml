# Flow Policy architecture config for learning/train_dagger.py -- 4-robot fleet
model:
  policy_type: flow             # options: mlp, flow, safeflow

  flow:
    num_inference_steps: 3      # Euler integration steps for ODE sampling

  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 10        # number of future action steps to predict, set to 1 for single-step prediction
  hidden_dims: [256, 256, 256]  # Velocity prediction network hidden layers

  encoder: deepset              # options: deepset, transformer, gnn

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128, 128]
    pool_type: mean             # options: sum, max, mean

  transformer:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    dropout: 0.1

# Optional DAgger defaults. Explicit command-line arguments override these values.
training:
  dagger_iterations: 10
  trajectories_per_iteration: [200, 200, 200, 200, 200, 200, 200, 200, 200, 200]
  steps_per_trajectory: 250
  target_epochs_per_round: [40, 40, 40, 40, 40, 40, 40, 40, 40, 40]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  expert_mix_beta_recovery: 0.75
  expert_mix_beta_recovery_increment: 0.25
  # adaptive_beta_recovery: true
  eval_episodes: 200
  workspace_bounds: [-3.0, 3.0]
  tolerance_overrides:
    pos_tol: 0.1
    theta_tol: 0.78
    vel_tol: 0.1
    omega_tol: 0.1
  # Deliberately more relaxed than tolerance_overrides above: collection/
  # training wants precise demonstrations, but eval only cares whether the
  # rollout got close and stayed collision-free, not exact final-pose
  # matching. Falls back to tolerance_overrides if omitted.
  eval_tolerance_overrides:
    pos_tol: 0.2
    theta_tol: 1.1
    vel_tol: 0.5
    omega_tol: 0.5
  training_curriculum: [config, config, config, config, config, config, config, config, config, config]
  # round_seeds: [0, 0, 0]    # base seed per round for random initial-state/goal sampling
  # restart_round_seed: true  # true replays identical draws whenever round_seeds repeats a value
  # 20 hard 4-robot scenarios: all four robots start on a circle (5 radii x
  # 4 base rotations of the circle), placed 90 degrees apart so opposite
  # robots face each other across the center (two head-on pairs -- one
  # roughly horizontal, one roughly vertical at rotation 0, rotating toward
  # an "X" layout as the base rotation approaches 45 degrees), heading
  # toward the center, and each is sent to its diametrically opposite point
  # with the same heading -- forcing every robot's straight-line path
  # through the shared center, the hardest coordination case for a fleet
  # this size. Radii capped at 1.9 (max pairwise separation ~3.81) so the
  # diagonal pair never starts outside inter_robot_visibility_radius=4.0 --
  # at 2.5 that pair would start 5.0 apart, invisible to each other from
