# Dataset settings
dataset:
  repo_id: local/double_integrator_casadi_expert
  root: data/lerobot_dataset_double_integrator_casadi

# Policy settings
policy:
  type: diffusion
  device: mps
  
  repo_id: jovaldivieso/double_integrator_casadi_diffusion_policy
  push_to_hub: true
  
  # Neural network settings (Adjusted down_dims length to 2 so horizon=4 is a valid multiple)
  down_dims: [32, 64]
  diffusion_step_embed_dim: 16  
  
  # Inference Speed Optimizations
  noise_scheduler_type: DDIM    # Faster deterministic sampling
  num_inference_steps: 10       # Rapid evaluation
  
  # Closed-loop horizon matching ACT's chunk size (4 is divisible by len(down_dims)=2)
  horizon: 4                    
  n_action_steps: 4             
  n_obs_steps: 1
  
  # Explicitly tell LeRobot how to normalize the states
  normalization_mapping:
    STATE: MIN_MAX
    ENV: MIN_MAX
    ACTION: MIN_MAX
  
  # Split inputs to satisfy the architecture
  input_features:
    observation.environment_state:
      shape: [2]
      type: ENV
    observation.state:
      shape: [2]
      type: STATE
      
  output_features:
    action:
      shape: [2]
      type: ACTION

  drop_n_last_frames: 0

# Training settings
steps: 12500
save_freq: 12500
batch_size: 64
num_workers: 0
save_checkpoint: true
