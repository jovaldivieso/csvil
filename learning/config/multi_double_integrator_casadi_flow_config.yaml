# Flow Policy architecture config for learning/train_dagger.py
# Input/output dimensions are inferred from simulator dataset features and action space.

model:
  policy_type: flow  # options: mlp, flow
  observation_horizon: 1
  prediction_horizon: 16  # number of future action steps to predict

  flow:
    num_inference_steps: 10  # Euler integration steps for ODE sampling

  # Noise prediction network hidden layers
  hidden_dims: [256, 256, 256]

  encoder: deepset
  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]
    pool_type: max
