# Flow Policy architecture config for learning/train_dagger.py
# Input/output dimensions are inferred from simulator dataset features and action space.

model:
  policy_type: flow  # options: mlp, flow
  prediction_horizon: 20  # number of future action steps to predict

  flow:
    num_inference_steps: 5  # Euler integration steps for ODE sampling

  # Noise prediction network hidden layers
  hidden_dims: [256, 256, 128]

  encoder: deepset                # Set to transformer, GNN, etc
  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]
    pool_type: sum                # Can be sum, max, mean
