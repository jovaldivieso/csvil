# Flow Policy architecture config for learning/train_dagger.py
model:
  policy_type: flow             # options: mlp, flow

  flow:
    num_inference_steps: 10     # Euler integration steps for ODE sampling

  observation_horizon: 2        # number of past observation steps to consider
  prediction_horizon: 10        # number of future action steps to predict, set to 1 for single-step prediction
  hidden_dims: [256, 256, 256]  # Velocity prediction network hidden layers
  
  encoder: deepset              # Set to transformer, GNN, etc
  
  deepset:
    phi_dims: [128, 128]
    rho_dims: [128]
    pool_type: sum              # Can be sum, max, mean

  #encoder: transformer

  #transformer:
  #  hidden_dim: 64
  #  num_heads: 4
  #  num_layers: 1
  #  dropout: 0.1

# Optional DAgger defaults. Explicit command-line arguments override these values.
training:
  dagger_iterations: 5
  trajectories_per_iteration: [50]
  steps_per_trajectory: 200
  target_epochs_per_round: [50, 40, 30, 20, 10]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.5
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  eval_episodes: 100
  config_goal_after_eval_success: 80
  initial_states: [[[-2.0, 0.0, 1.57, 0.0, 0.0], [2.0, 0.0, 1.57, 0.0, 0.0]]]