# Flow Policy architecture config for learning/train_dagger.py
model:
  policy_type: safeflow         # options: mlp, flow, safeflow

  flow:
    num_inference_steps: 3      # Euler integration steps for ODE sampling

  prediction_horizon: 10        # number of future action steps to predict, set to 1 for single-step prediction
  hidden_dims: [256, 256, 256]  # Velocity prediction network hidden layers

  encoder: deepset              # options: deepset, transformer, gnn

  deepset:
    phi_dims: [128, 128]
    rho_dims: [128, 128]
    pool_type: sum              # options: sum, max, mean

# Optional DAgger defaults. Explicit command-line arguments override these values.
training:
  dagger_iterations: 5
  trajectories_per_iteration: [200, 200, 200, 200, 200]
  steps_per_trajectory: 250
  target_epochs_per_round: [40, 40, 40, 40, 40]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.75
  expert_mix_beta_decay_rate: 0.25
  expert_mix_decay_after_eval_success: 0.5
  expert_mix_beta_recovery: 0.75
  expert_mix_beta_recovery_increment: 0.25
  eval_episodes: 200
  workspace_bounds: [-3.0, 3.0]
  tolerance_overrides:
    error_tolerance: 0.1
  # Deliberately more relaxed than tolerance_overrides above: collection/
  # training wants precise demonstrations, but eval only cares whether the
  # rollout got close and stayed collision-free, not exact final-state
  # matching. Falls back to tolerance_overrides if omitted.
  eval_tolerance_overrides:
    error_tolerance: 0.2
  training_curriculum: ['config', 'config', 'config', 'config', 'config']
