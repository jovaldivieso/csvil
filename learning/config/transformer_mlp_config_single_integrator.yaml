model:
  policy_type: mlp
  observation_horizon: 2        
  prediction_horizon: 1        
  hidden_dims: [256, 256, 256]

  encoder: transformer

  transformer:
    hidden_dim: 128        
    num_heads: 4
    num_layers: 1
    dropout: 0.1

training:
  workspace_bounds: [0.0, 8.0]
  dagger_iterations: 5
  trajectories_per_iteration: [40, 40, 40, 40, 40]
  steps_per_trajectory: 300
  target_epochs_per_round: [20, 20, 20, 20, 20]
  action_noise_std: 0.03
  expert_mix_beta_start: 0.6
  expert_mix_beta_decay_rate: 0.2
  expert_mix_decay_after_eval_success: 0.4
  expert_mix_beta_recovery: 0.75
  expert_mix_beta_recovery_increment: 0.25
  eval_episodes: 20

  # initial_states and goals were created with ChatGPT:
  initial_states:
    # 1-5: cardinal swaps with different radius
    - [[6.0, 4.0], [4.0, 6.0], [2.0, 4.0], [4.0, 2.0]]
    - [[5.8, 4.0], [4.0, 5.8], [2.2, 4.0], [4.0, 2.2]]
    - [[6.2, 4.0], [4.0, 6.2], [1.8, 4.0], [4.0, 1.8]]
    - [[6.4, 4.0], [4.0, 6.4], [1.6, 4.0], [4.0, 1.6]]
    - [[5.6, 4.0], [4.0, 5.6], [2.4, 4.0], [4.0, 2.4]]

    # 6-10: diagonal swaps
    - [[5.5, 5.5], [2.5, 5.5], [2.5, 2.5], [5.5, 2.5]]
    - [[5.3, 5.3], [2.7, 5.3], [2.7, 2.7], [5.3, 2.7]]
    - [[5.7, 5.7], [2.3, 5.7], [2.3, 2.3], [5.7, 2.3]]
    - [[5.9, 5.9], [2.1, 5.9], [2.1, 2.1], [5.9, 2.1]]
    - [[5.1, 5.1], [2.9, 5.1], [2.9, 2.9], [5.1, 2.9]]

    # 11-15: rectangular configurations
    - [[6.2, 5.2], [1.8, 5.2], [1.8, 2.8], [6.2, 2.8]]
    - [[6.0, 5.5], [2.0, 5.5], [2.0, 2.5], [6.0, 2.5]]
    - [[6.4, 4.8], [1.6, 4.8], [1.6, 3.2], [6.4, 3.2]]
    - [[5.8, 5.7], [2.2, 5.7], [2.2, 2.3], [5.8, 2.3]]
    - [[6.3, 5.0], [1.7, 5.0], [1.7, 3.0], [6.3, 3.0]]

    # 16-20: perturbed cardinal arrangements
    - [[6.1, 3.8], [4.2, 6.2], [1.9, 4.3], [3.7, 1.8]]
    - [[5.9, 4.3], [3.7, 5.9], [2.1, 3.7], [4.3, 2.1]]
